[package]
name = "nextaction"
version = "0.1.0"
edition = "2021"

[lib]
name = "nextaction"
path = "src/lib.rs"

[[bin]]
name = "distribution"
path = "src/distribution.rs"

[[bin]]
name = "netflow"
path = "src/netflow.rs"

[[bin]]
name = "signal"
path = "src/signal.rs"

[[bin]]
name = "backtest"
path = "src/backtest.rs"

