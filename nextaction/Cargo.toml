path = "src/volatility.rs"

[[bin]]
name = "coordination"
path = "src/coordination.rs"

[[bin]]
name = "leadlag"
path = "src/leadlag.rs"

[dependencies]
# Довідники (ролі мережі, пороги) — у SQLite, не в коді.
wr-store = { path = "../wr-store" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
wr-dict = { path = "../wr-dict" }   # спільний словник (Фаза 0.2): частка емісії = єдина формула

[profile.release]
opt-level = 3

