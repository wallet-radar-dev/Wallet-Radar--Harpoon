[package]
name = "gat"
version = "0.1.0"
edition = "2021"

# candle — автоград на чистому Rust. Саме через нього тут більше не потрібен ні PyTorch, ні
# torch_geometric, ні образ на два гігабайти: граф крихітний (1891 вузол, 5570 ребер), і вся
# «важкість» старого стека була платою за зручність, а не за обчислення.
[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
serde_json = "1"
anyhow = "1"
rand = "0.8"

[profile.release]
opt-level = 3
