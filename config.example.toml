# Приклад конфігурації Wallet Radar Alerts Bot.
#
# Секретів тут немає: у TOML — лише ІМЕНА змінних оточення. Значення читаються
# з оточення, тому цей файл можна комітити в git, а `.env` — ні.
#
# Запуск:  TELEGRAM_BOT_TOKEN=... WR_PASSWORD=... ./bot config.toml

[bot]
name = "wallet-radar-alerts"
# Ім'я змінної оточення з токеном Telegram. Токен НІКОМУ не пиши в цей файл.
token_env = "TELEGRAM_BOT_TOKEN"
default_language = "uk"          # uk | en
default_timezone = "Europe/Kyiv"
poll_timeout_secs = 25
heartbeat_timeout_secs = 90
log_level = "info"
# Секрет для HMAC-підписів chat_ref у логах: у лог потрапляє хеш, а не chat_id.
ref_secret_env = "BOT_REF_SECRET"
# Що робити, коли Telegram відповів 409 (на токені вже працює інший полер):
#   keep_running — зупинити лише опитування команд; збір даних, згортання
#                  й доставка алертів продовжуються. Опитування повторюється
#                  автоматично — оживе, коли конфлікт зникне;
#   preempt      — перехопити токен: повторити опитування за кілька секунд,
#                  щоб перебити чужий запит. Telegram віддає 409 старшому з
#                  двох запитів, а новіший перемагає — тож ми забиратимемо
#                  оновлення собі, а не чекатимемо, поки конкурент зникне;
#   exit         — завершити процес: нічого не дублюємо, але й нічого не
#                  надсилаємо.
poll_conflict_policy = "preempt"
# Пауза між повторами опитування після 409 (політика `keep_running`).
poll_conflict_retry_secs = 60
# Пауза перед повтором опитування в політиці `preempt`: чим менша, тим
# швидше ми переб'ємо чужий запит (і тим довше висить наш).
poll_conflict_preempt_secs = 2

[telegram]
# Перевизначення адреси Telegram API. Потрібне лише для тестів і моків;
# у продакшні — порожньо.
api_url = ""

[wr]
base_url = "http://127.0.0.1:3000"
username = "admin"
# Пароль читача Wallet Radar — те саме, що для веб-доступу.
password_env = "WR_PASSWORD"
poll_interval_secs = 60          # як часто брати зріз агрегатів
event_poll_interval_secs = 15    # страхувальний опитування подій
request_timeout_secs = 20
ws_path = "/ws"
# Синхронізація реєстру підключених із сервером Wallet Radar: сервер
# замінює свій файл реєстру цілком, тож лише один інстанс має право на запис.
# Для тестів і локальних прогонів — false.
registry_sync_enabled = true
sync_token_env = "TELEGRAM_SYNC_TOKEN"
registry_sync_interval_secs = 60
# Додаткові сервери Wallet Radar, куди теж пишеться реєстр.
# У мережі буває кілька незалежних екземплярів, і в кожному реєстр — це список,
# за яким сервер розсилає свої власні алерти. Якщо екземпляр має ввімкнений
# Telegram, але його реєстр не оновлюється, підписки розходять: нові
# підписники не отримують серверних алертів.
registry_sync_extra_urls = []
# registry_sync_extra_urls = ["http://192.168.2.222:3000"]

[storage]
backend = "sqlite"               # sqlite | postgres
sqlite_path = "data/bot.db"
busy_timeout_ms = 5000

[privacy]
mask = "приховано"
redact_ens = true
redact_explorer_urls = true
redact_base58 = true
# Свої explorer'и, якщо з'являться.
extra_blocked_domains = []

[rate_limits]
per_user_per_min = 20
admin_per_min = 60
global_inbound_per_min = 200
telegram_global_per_sec = 25      # ліміт Telegram — 30/с
telegram_per_chat_min_interval_ms = 1050  # ліміт Telegram — 1/с на чат
max_pending_per_chat = 20

[broadcast]
# Згортання «широких» сигналів у зведений дайджест.
#
# `digest_threshold_pct` — частка активних користувачів (у відсотках), яка
# має отримати той самий сигнал, щоб він вважався «широким» і згорнувся.
#   0   — згортати все;
#   25  — згортати лише сигнали, що йдуть щонайменше 25% користувачів;
#   100 — згортати лише те, що йде ВСІМ.
# Вузькі (персональні) сигнали лишаються детальними й негайними.
#
# `digest_window_secs` — вікно згортання: раз на стільки секунд збирається
# одне зведене повідомлення замість окремих на кожен алерт.
#
# Сигнал, який доходить лише до одного одержувача, не згортається ніколи:
# згортання має сенс, коли один і той самий сигнал іде багатьом.
digest_threshold_pct = 25
digest_window_secs = 300
# Межа буфера черги розсилки.
#
# Поки джерело (Wallet Radar) недоступне, черга **буферизується**: доставки
# не надсилаються, а накопичуються. Коли джерело оживає — буфер виливається.
#
# «Джерело недоступне» = сервер не відповів узагалі понад 2 хв. Відсутність
# маршруту (404) — це відповідь сервера, а не збій: буфер тоді не вмикається.
#
# `max_backlog_minutes` — скільки хвилин доставка може чекати в буфері:
#   0  — обмеження вимкнено (буфер безстроковий);
#   30 — доставка, що провисела понад 30 хв, скидається і НЕ надсилається
#        ніколи: вікно агрегації застаріло, а «кит накопичував 2 години
#        тому» — це не інформація, а шум.
#
# Скинуті доставки видно в `/stats`: «скинуто за межею».
max_backlog_minutes = 30

[admin]
usernames = []                    # порожньо = адмінських команд немає
access_code_env = "BOT_ACCESS_CODE"  # порожньо або не задано = /start без коду

[features]
# Асистент на основі /api/ask вимкнено: LLM може процитувати сирі дані.
assistant = false

# Пороги алертів. Якщо список порожній — бот бере дефолтні правила.
[[alerts.rules]]
kind = "whale_accumulation"       # whale_accumulation | whale_distribution | liquidation_spike | cross_asset_anomaly
min_participants = 3
min_total_value_usd = 20000
windows = ["15m", "1h"]
assets = []                       # порожньо = усі активи
severity = "medium"               # info | medium | high

[[alerts.rules]]
kind = "whale_distribution"
min_participants = 3
min_total_value_usd = 20000
windows = ["1h"]
assets = []
severity = "medium"

[[alerts.rules]]
kind = "liquidation_spike"
min_participants = 1
min_total_value_usd = 250000
windows = ["1h"]
assets = []
severity = "high"

[[alerts.rules]]
kind = "cross_asset_anomaly"
min_participants = 10
min_total_value_usd = 0
windows = ["1h"]
assets = []
severity = "info"
