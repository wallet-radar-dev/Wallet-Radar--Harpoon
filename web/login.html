<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Radar — вхід</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b0f1a;color:#e8eef7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{width:100%;max-width:360px;padding:28px;border:1px solid #1f2b3d;border-radius:16px;
        background:#111827}
  h1{font-size:18px;font-weight:650;margin-bottom:6px}
  p.sub{font-size:12px;color:#8fa3bd;margin-bottom:20px}
  label{display:block;font-size:12px;color:#8fa3bd;margin-bottom:6px}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #1f2b3d;
        background:#0b0f1a;color:#e8eef7;font-size:14px}
  input:focus{outline:none;border-color:#3b82f6}
  button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:10px;
         background:#3b82f6;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:12px;font-size:12px;color:#f87171;min-height:16px}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Wallet Radar</h1>
    <p class="sub">Введи пароль доступу</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="btn" type="submit">Увійти</button>
    <div class="err" id="err"></div>
  </form>
<script>
  const f = document.getElementById("f");
  const pw = document.getElementById("pw");
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Перевірка…";
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: pw.value }),
      });
      if (r.ok) { location.href = "/"; return; }
      const d = await r.json().catch(() => ({}));
      err.textContent = d.error || "Не вдалося увійти";
    } catch {
      err.textContent = "Сервер недоступний";
    }
    btn.disabled = false;
    btn.textContent = "Увійти";
    pw.select();
  });
</script>
</body>
</html>
