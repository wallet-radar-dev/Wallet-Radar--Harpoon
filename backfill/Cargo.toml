[package]
name = "backfill"
version = "0.1.0"
edition = "2021"

[lib]
name = "backfill"
path = "src/lib.rs"

[[bin]]
name = "backfill"
path = "src/main.rs"

[[bin]]
name = "backfill2"
path = "src/backfill2.rs"

[[bin]]
name = "btc-signature"
path = "src/btc_signature.rs"

[[bin]]
name = "btc-expand"
path = "src/btc_expand.rs"

[[bin]]
name = "btc-collect"
path = "src/btc_collect.rs"

[[bin]]
name = "eth-native"
path = "src/eth_native.rs"

[[bin]]
name = "expand-backfill-list"
path = "src/expand_backfill_list.rs"

[dependencies]
# Довідники (стейбли, адреси, пороги) — у SQLite, не в коді.
wr-store = { path = "../wr-store" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
wr-dict = { path = "../wr-dict" }   # спільний словник (Фаза 0.2): частка емісії = єдина формула
zstd = "0.13"                       # архіви transfers-*.csv: 7.3x стиснення, див. src/csvin.rs

[profile.release]
opt-level = 1

