[package]
name = "wr-dict"
version = "0.1.0"
edition = "2021"

# СПІЛЬНИЙ словник даних (Фаза 0.2 плану Oracul-Aladdin): один крейт, на який
# можуть перейти і рушій `patterns`, і старі біни backfill/nextaction — щоб два
# різні інструменти давали ту саму цифру.
#
# Раніше тут було написано «чистий Rust, без залежностей». Більше ні: пороги,
# контракти й таблиці адрес переїхали у SQLite (крейт wr-store), бо словник
# не може бути джерелом правди, поки його правда зашита в компіляцію.

[lib]
name = "wr_dict"
path = "src/lib.rs"

[dependencies]
wr-store = { path = "../wr-store" }
